<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Google Docs</title>
    <meta name="description" content="Google Docs style loading screen">
    <link rel="icon" href="https://ssl.gstatic.com/docs/documents/images/kix-favicon-2023q4.ico">
    <style>
      :root {
        --bg: #09090b;
        --panel: rgba(255, 255, 255, 0.04);
        --white: #f5f5f5;
        --muted: #a1a1aa;
        --line: rgba(255, 255, 255, 0.08);
        --bar: rgba(255, 255, 255, 0.5);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--white);
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
      }

      .screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
      }

      #loader {
        flex-direction: column;
        gap: 22px;
        transition: opacity 0.25s ease;
      }

      #loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #loader img,
      #error img {
        width: 220px;
        max-width: 70vw;
        display: block;
        opacity: 0.95;
        user-select: none;
        pointer-events: none;
      }

      .wordmark {
        color: var(--white);
        font-weight: 700;
        font-size: 17px;
        letter-spacing: 0.45em;
        text-indent: 0.45em;
        text-transform: uppercase;
      }

      .bar {
        width: 130px;
        height: 2px;
        border-radius: 999px;
        overflow: hidden;
        background: var(--line);
      }

      .bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: var(--bar);
        animation: slide 1.1s ease-in-out infinite;
      }

      @keyframes slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(330%); }
      }

      #error {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 28px;
      }

      #error.visible {
        display: flex;
      }

      #error img {
        width: 190px;
        max-width: 60vw;
        margin-bottom: 22px;
      }

      #error h1 {
        margin: 0 0 10px;
        color: var(--white);
        font-size: 15px;
        font-weight: 700;
      }

      #error .reason {
        margin: 0 0 18px;
        max-width: 460px;
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.6;
      }

      #error pre {
        margin: 0 0 18px;
        max-width: 540px;
        padding: 12px 14px;
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.03);
        color: #71717a;
        font: 11px/1.7 monospace;
        white-space: pre-wrap;
        text-align: left;
      }

      #error button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #000;
        padding: 10px 18px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      @media (max-width: 480px) {
        #loader img,
        #error img {
          width: 170px;
        }

        .wordmark {
          letter-spacing: 0.2em;
          text-indent: 0.2em;
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div id="loader" class="screen" aria-live="polite" aria-label="Loading Google Docs">
      <img src="https://ssl.gstatic.com/docs/documents/images/kix-favicon-2023q4.ico" alt="Google Docs logo">
      <div class="wordmark">Docs</div>
      <div class="bar" aria-hidden="true"><i></i></div>
    </div>

    <div id="error" class="screen" aria-live="assertive" aria-label="Document failed to load">
      <img src="https://ssl.gstatic.com/docs/documents/images/kix-favicon-2023q4.ico" alt="Google Docs logo">
      <h1>We're having trouble loading this document.</h1>
      <p class="reason">The file may be unavailable or your connection may be unstable.</p>
      <pre id="errorCode">ERR_LOAD_DOC</pre>
      <button type="button" id="retryBtn">Try again</button>
    </div>

    <script>
      const loader = document.getElementById('loader');
      const errorBox = document.getElementById('error');
      const retryBtn = document.getElementById('retryBtn');
      const errorCode = document.getElementById('errorCode');

      function showLoading() {
        loader.style.display = 'flex';
        loader.classList.remove('hidden');
        errorBox.style.display = 'none';
        errorBox.classList.remove('visible');
      }

      function showError(message = 'ERR_LOAD_DOC') {
        loader.classList.add('hidden');
        errorCode.textContent = message;
        errorBox.style.display = 'flex';
        errorBox.classList.add('visible');
      }

      function finishLoading() {
        loader.classList.add('hidden');
      }

      retryBtn.addEventListener('click', () => {
        showLoading();

        setTimeout(() => {
          const url = new URL(window.location.href);
          if (url.searchParams.get('error') === '1') {
            showError('ERR_AUTH_REQUIRED');
          } else {
            finishLoading();
          }
        }, 1200);
      });

      window.addEventListener('DOMContentLoaded', () => {
        const url = new URL(window.location.href);

        if (url.searchParams.get('error') === '1') {
          showError('ERR_AUTH_REQUIRED');
          return;
        }

        showLoading();

        setTimeout(() => {
          finishLoading();
        }, 2200);
      });
    </script>
  </body>
</html>

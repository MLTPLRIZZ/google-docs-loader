<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Docs</title>
  <link rel="icon" href="https://ssl.gstatic.com/docs/documents/images/kix-favicon-2023q4.ico">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #09090b;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      transition: opacity 0.25s ease;
    }

    #loader img {
      width: 220px;
      max-width: 70vw;
      pointer-events: none;
      opacity: 0.95;
    }

    .wordmark {
      display: none;
      color: #fafafa;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.45em;
      text-indent: 0.45em;
    }

    .bar {
      width: 130px;
      height: 2px;
      border-radius: 2px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
    }

    .bar i {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.5);
      animation: slide 1.1s ease-in-out infinite;
    }

    @keyframes slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(330%); }
    }

    #error {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      text-align: center;
      overflow: auto;
      box-sizing: border-box;
      background: #09090b;
    }

    #error img {
      width: 190px;
      max-width: 60vw;
      opacity: 0.9;
      margin-bottom: 22px;
    }

    #error h1 {
      color: #fafafa;
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 8px;
    }

    #error .reason {
      color: #a1a1aa;
      font-size: 12.5px;
      line-height: 1.6;
      max-width: 460px;
      margin: 0 0 16px;
    }

    #error pre {
      color: #71717a;
      font: 11px/1.7 monospace;
      text-align: left;
      white-space: pre-wrap;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 8px;
      padding: 12px 14px;
      max-width: 540px;
      margin: 0 0 18px;
    }

    #error button {
      background: #fff;
      color: #000;
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="loader" aria-live="polite" aria-label="Loading Google Docs">
    <img alt="Google Docs" src="https://ssl.gstatic.com/docs/documents/images/kix-favicon-2023q4.ico">
    <div class="wordmark">DOCS</div>
    <div class="bar" aria-hidden="true"><i></i></div>
  </div>

  <div id="error" aria-live="assertive" aria-label="Document failed to load">
    <img alt="Google Docs" src="https://ssl.gstatic.com/docs/documents/images/kix-favicon-2023q4.ico">
    <h1>We’re having trouble loading this document.</h1>
    <p class="reason">The file may be unavailable, or your connection may be unstable.</p>
    <pre id="errorCode">ERR_LOAD_DOC</pre>
    <button type="button" id="retryBtn">Try again</button>
  </div>

  <script>
    const loader = document.getElementById('loader');
    const errorBox = document.getElementById('error');
    const retryBtn = document.getElementById('retryBtn');
    const errorCode = document.getElementById('errorCode');

    function showError(message = 'ERR_LOAD_DOC') {
      loader.style.opacity = '0';
      setTimeout(() => {
        loader.style.display = 'none';
        errorCode.textContent = message;
        errorBox.style.display = 'flex';
      }, 250);
    }

    function hideError() {
      errorBox.style.display = 'none';
      loader.style.display = 'flex';
      loader.style.opacity = '1';
    }

    retryBtn.addEventListener('click', () => {
      hideError();
      setTimeout(() => {
        if (Math.random() > 0.8) {
          showError('ERR_NETWORK_TIMEOUT');
        }
      }, 1200);
    });

    setTimeout(() => {
      if (window.location.search.includes('error=1')) {
        showError('ERR_AUTH_REQUIRED');
      } else if (Math.random() > 0.9) {
        showError('ERR_SERVER_UNAVAILABLE');
      }
    }, 1800);
  </script>
</body>
</html>
